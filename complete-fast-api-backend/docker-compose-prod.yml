version: "3"
services:
  api:
    # push image on dockerhub and pull
    # build: .
    image: username/fastapi:tag
    depends_on:
      - postgres
    ports:
      # - <port on localhost>:<port on container>
      - 80:8000
    # volumes:
    #   - ./:/usr/src/app:ro
    # command: uvicorn app.main:app  --host 0.0.0.0 --port 8000
    env_file:
      - ./.env
    environment:
      # get from env variables on host machine
      - DATABASE_HOSTNAME=postgres
      - DATABASE_HOSTNAME=${DATABASE_HOSTNAME}
      - DATABASE_PORT=5432
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=fastapi

    volumes:
      - postgres-db:/var/lib/postgresql/data
